
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayı Tahmin Oyunu</title>

    <style>
        body {
            background-color: #1e293b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .kutu {
            background-color: #334155;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }

        input {
            padding: 12px;
            width: 180px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            background-color: #22c55e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #16a34a;
        }

        #mesaj {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="kutu">
        <h1>🎯 Sayı Tahmin Oyunu</h1>

        <p>1 ile 10 arasında bir sayı tahmin et!</p>
        <p>Toplam 5 tahmin hakkın var.</p>

        <input type="number" id="tahmin"
               min="1" max="10"
               placeholder="Sayı giriniz">

        <button id="tahminButonu" onclick="kontrolEt()">
            Tahmin Et
        </button>

        <p id="mesaj"></p>
        <p id="hak">Kalan hak: 5</p>

        <button onclick="yenidenBasla()">
            Yeniden Oyna
        </button>
    </div>

    <script>
        let secretNumber = Math.floor(Math.random() * 10) + 1;
        let hak = 5;
        let oyunBitti = false;

        function kontrolEt() {
            if (oyunBitti) return;

            let input = document.getElementById("tahmin");
            let tahmin = Number(input.value);
            let mesaj = document.getElementById("mesaj");

            if (input.value === "" ||
                !Number.isInteger(tahmin) ||
                tahmin < 1 || tahmin > 10) {
                mesaj.textContent =
                    "1 ile 10 arasında tam sayı giriniz.";
                return;
            }

            hak--;

            if (tahmin === secretNumber) {
                mesaj.textContent = "🎉 Tebrikler! Doğru tahmin!";
                oyunBitti = true;
            }
            else if (hak === 0) {
                mesaj.textContent =
                    "😢 Hakkınız bitti! Doğru sayı: " + secretNumber;
                oyunBitti = true;
            }
            else if (tahmin < secretNumber) {
                mesaj.textContent = "Daha büyük bir sayı giriniz!";
            }
            else {
                mesaj.textContent = "Daha küçük bir sayı giriniz!";
            }

            document.getElementById("hak").textContent =
                "Kalan hak: " + hak;

            if (oyunBitti) {
                input.disabled = true;
                document.getElementById("tahminButonu").disabled = true;
            } else {
                input.value = "";
                input.focus();
            }
        }

        function yenidenBasla() {
            secretNumber = Math.floor(Math.random() * 10) + 1;
            hak = 5;
            oyunBitti = false;

            let input = document.getElementById("tahmin");
            input.disabled = false;
            input.value = "";

            document.getElementById("tahminButonu").disabled = false;
            document.getElementById("mesaj").textContent = "";
            document.getElementById("hak").textContent =
                "Kalan hak: 5";

            input.focus();
        }

        document.getElementById("tahmin").addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    kontrolEt();
                }
            }
        );
    </script>

</body>
</html>
